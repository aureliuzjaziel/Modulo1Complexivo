<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Libros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow border-0" style="width: 100%; max-width: 550px;">
    <div class="card-header bg-dark text-white p-3">
        <h3 class="card-title h5 mb-0 fw-bold" th:text="${libro.id == null} ? '📖 Ingresar Nuevo Libro' : '📝 Modificar Registro' "></h3>
    </div>

    <div class="card-body p-4">
        <form th:action="@{/libros/guardar}" th:object="${libro}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Título de la Obra:</label>
                <input type="text" th:field="*{titulo}" class="form-control form-control-lg fs-6" required placeholder="Ej. Cien años de soledad">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Autor Registrado (JPA 1:N):</label>
                <select th:field="*{autor}" class="form-select" required>
                    <option value="" disabled selected>-- Seleccione el escritor --</option>
                    <option th:each="a : ${autores}"
                            th:value="${a.id}"
                            th:text="${a.nombre}">
                    </option>
                </select>
                <div class="form-text">Si la lista sale vacía, recuerda poblar la tabla autores en MySQL.</div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">Precio al Público ($):</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" required placeholder="0.00">
                </div>
            </div>

            <div class="d-flex gap-2 justify-content-end border-top pt-3">
                <a th:href="@{/libros}" class="btn btn-light rounded px-4">Volver</a>
                <button type="submit" class="btn btn-success rounded px-4 shadow-sm">Guardar Datos</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
